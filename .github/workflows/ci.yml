name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Deterministic, no-secret gates. The safety test blocks any change that
      # reintroduces the crisis-regex false positives or the dead "suicide"
      # branch. The full LLM eval (npm run eval) needs an API key and is run
      # manually, not in CI.
      - run: npm run lint
      - run: npm run test:safety
      - run: npm run build
